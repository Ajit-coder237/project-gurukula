version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tutoros
      POSTGRES_USER: tutoros
      POSTGRES_PASSWORD: tutoros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:20
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  animation:
    build: ./apps/animation-service
    ports:
      - "8001:8001"

volumes:
  pgdata:
